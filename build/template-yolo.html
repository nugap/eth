<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*; img-src data:">
<title>YOLO</title>
<style>body{font-family:monospace;padding:8px;max-width:560px;margin:0 auto}input,textarea{width:100%;margin:2px 0;padding:5px;font-family:monospace;box-sizing:border-box}button{margin:2px 0;padding:6px 14px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;background:#f0f0f0;padding:6px;margin:2px 0}.mono{word-break:break-all}fieldset{border:1px solid #ccc;padding:6px;margin:6px 0}</style>
<div id="notify" style="position:fixed;top:0;left:0;right:0;padding:6px;text-align:center;display:none"></div>
<b>NUGAP YOLO (ETH)</b> <span id="net-label"></span>
<div id="phase-init">
<fieldset><legend>Import Address</legend>
<input id="inp-addr" placeholder="0x...">
<button id="btn-import">Import</button>
</fieldset>
</div>
<div id="phase-dash" style="display:none">
<fieldset><legend>Wallet</legend>
<div id="dash-addr" class="mono"></div>
<b id="dash-balance">0 ETH</b><br>
<span id="dash-nonce"></span><br>
<span id="dash-updated"></span><br>
<button id="btn-refresh">Refresh</button>
<button id="btn-reset">Reset</button>
</fieldset>
<fieldset><legend>Send</legend>
<input id="inp-recipient" placeholder="Recipient 0x...">
<input id="inp-amount" placeholder="Amount (ETH)" inputmode="decimal">
<input id="inp-gas-limit" type="number" value="21000" placeholder="Gas Limit">
<input id="inp-priority-fee" placeholder="Max Priority Fee (Gwei) - auto" inputmode="decimal">
<input id="inp-max-fee" placeholder="Max Fee (Gwei) - auto" inputmode="decimal">
<button id="btn-create-tx">Create Transaction</button>
</fieldset>
<div id="psbt-area" style="display:none">
<fieldset><legend>Unsigned Transaction</legend>
<pre id="tx-preview"></pre>
<textarea id="tx-out" rows="4" readonly></textarea>
<button data-copy="tx-out">Copy</button>
</fieldset>
</div>
<fieldset><legend>Import Signed TX</legend>
<textarea id="inp-signed" rows="4" placeholder="Paste signed TX from hodl (hex or base64)"></textarea>
<button id="btn-do-import-signed">Import Signed TX</button>
</fieldset>
<div id="broadcast-area" style="display:none">
<fieldset><legend>Broadcast Transaction</legend>
<pre id="broadcast-info"></pre>
<b style="color:red">This will send real ETH. Cannot be undone.</b><br>
<button id="btn-broadcast">Broadcast</button>
</fieldset>
</div>
<div id="result-area" style="display:none">
<fieldset><legend style="color:green">Transaction Broadcast!</legend>
<pre id="result-info"></pre>
</fieldset>
</div>
</div>
<script>
/* __BUNDLE_JS__ */
</script>
<script>
'use strict';
const NETWORK = '/* __NETWORK__ */', IS_TEST = NETWORK === 'sepolia', NET = IS_TEST ? ETH_SEPOLIA : ETH_MAINNET;
const APP = { address: null, balance: 0n, nonce: 0, signedTxHex: null };
const goPhase = name => { ['phase-init','phase-dash'].forEach($hide); $show('phase-' + name) };
const resetDynamic = () => { $hide('psbt-area'); $hide('broadcast-area'); $hide('result-area') };
const sleep = ms => new Promise(r => setTimeout(r, ms));

$t('net-label', IS_TEST ? '[Sepolia]' : '[Mainnet]');

const rpc = async (method, params) => {
  for (let i = 0; i < 4; i++) {
    try {
      const res = await fetch(NET.rpc, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
      const json = await res.json();
      if (json.error) throw new Error(json.error.message);
      return json.result;
    } catch(e) {
      if (e.message && e.message.includes('429') && i < 3) { await sleep(2000 * (i + 1)); continue }
      throw e;
    }
  }
};
const fetchBalance = async () => {
  const [bal, nonce] = await Promise.all([rpc('eth_getBalance', [APP.address, 'latest']), rpc('eth_getTransactionCount', [APP.address, 'latest'])]);
  APP.balance = BigInt(bal); APP.nonce = parseInt(nonce, 16);
};
const renderDash = () => {
  $t('dash-addr', APP.address);
  $t('dash-balance', formatEther(APP.balance) + ' ETH');
  $t('dash-nonce', 'Nonce: ' + APP.nonce);
  $t('dash-updated', 'Updated: ' + new Date().toLocaleTimeString());
};

$('btn-import').onclick = async () => {
  const addr = $v('inp-addr').trim();
  if (!isValidAddress(addr)) { notify('Invalid ETH address'); return }
  APP.address = checksumAddress(addr);
  try { await fetchBalance(); renderDash(); resetDynamic(); goPhase('dash'); notify('Imported', 'ok') }
  catch(e) { notify('Import failed: ' + e.message) }
};
$('btn-refresh').onclick = async () => {
  try { await fetchBalance(); renderDash(); notify('Updated', 'ok') }
  catch(e) { notify('Refresh failed: ' + e.message) }
};
$('btn-reset').onclick = () => { APP.address = null; APP.balance = 0n; APP.nonce = 0; resetDynamic(); goPhase('init') };
$('btn-create-tx').onclick = async () => {
  const recipient = $v('inp-recipient').trim();
  if (!isValidAddress(recipient)) { notify('Invalid recipient'); return }
  let amount;
  try { amount = parseEther($v('inp-amount').trim()) } catch(e) { notify('Invalid amount'); return }
  if (amount <= 0n) { notify('Amount must be > 0'); return }
  const gasLimit = parseInt($v('inp-gas-limit')) || 21000;
  try {
    let priorityFee, maxFee;
    const pf = $v('inp-priority-fee').trim(), mf = $v('inp-max-fee').trim();
    if (pf) { priorityFee = parseGwei(pf) } else {
      const fp = await rpc('eth_maxPriorityFeePerGas', []);
      priorityFee = BigInt(fp);
    }
    if (mf) { maxFee = parseGwei(mf) } else {
      const block = await rpc('eth_getBlockByNumber', ['latest', false]);
      const baseFee = BigInt(block.baseFeePerGas);
      maxFee = baseFee * 2n + priorityFee;
    }
    const tx = { chainId: NET.chainId, nonce: APP.nonce, to: checksumAddress(recipient), value: amount, gasLimit, maxPriorityFeePerGas: priorityFee, maxFeePerGas: maxFee };
    const unsigned = serializeEIP1559(tx);
    const b64 = toB64(unsigned);
    const maxCost = amount + maxFee * BigInt(gasLimit);
    let info = 'To: ' + tx.to + '\nAmount: ' + formatEther(amount) + ' ETH';
    info += '\nNonce: ' + APP.nonce + '\nGas Limit: ' + gasLimit;
    info += '\nMax Priority Fee: ' + formatGwei(priorityFee) + ' gwei';
    info += '\nMax Fee: ' + formatGwei(maxFee) + ' gwei';
    info += '\nMax Cost: ' + formatEther(maxCost) + ' ETH';
    $t('tx-preview', info); $v('tx-out', b64); $show('psbt-area'); $hide('broadcast-area'); $hide('result-area');
  } catch(e) { notify('TX error: ' + e.message) }
};
$('btn-do-import-signed').onclick = () => {
  let text = $v('inp-signed').trim();
  if (!text) { notify('Paste signed TX'); return }
  let rawBytes;
  if (text.startsWith('0x') || /^[0-9a-fA-F]+$/.test(text)) {
    rawBytes = hexToBytes(text.startsWith('0x') ? text.slice(2) : text);
  } else {
    rawBytes = fromB64(text);
    if (!rawBytes) { notify('Invalid data'); return }
  }
  try {
    const parsed = parseEIP1559(rawBytes);
    APP.signedTxHex = '0x' + bytesToHex(rawBytes);
    let info = 'To: ' + parsed.to;
    info += '\nValue: ' + formatEther(parsed.value) + ' ETH';
    info += '\nNonce: ' + parsed.nonce + '\nGas Limit: ' + parsed.gasLimit;
    info += '\nChain ID: ' + parsed.chainId;
    $t('broadcast-info', info); $show('broadcast-area'); $hide('result-area'); notify('Signed TX decoded', 'ok');
  } catch(e) { notify('Failed: ' + e.message) }
};
$('btn-broadcast').onclick = async () => {
  try {
    const txid = await rpc('eth_sendRawTransaction', [APP.signedTxHex]);
    $t('result-info', 'TXID: ' + txid + '\n\n' + NET.explorer + '/tx/' + txid);
    $show('result-area');
  } catch(e) { notify('Broadcast failed: ' + e.message) }
};
</script>
